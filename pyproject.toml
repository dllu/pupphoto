[project]
name = "pupphoto"
version = "0.1.0"
description = "Personal photo import and upload scripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "jinja2",
    "openai",
    "pillow",
    "pillow-heif>=1.3.0",
    "requests",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "albumize",
    "clipboard_util",
    "commons_categories",
    "config",
    "export_photos",
    "gps",
    "import",
    "open_gps_google_maps",
    "sync_hot_to_cold",
    "tag_promoted_images",
    "upload_blog",
    "upload_clipboard",
    "upload_commons",
    "upload_photo",
]

[tool.setuptools.data-files]
"share/pupphoto/static" = [
    "static/commons_upload.html",
    "static/commons_upload.css",
    "static/commons_upload.js",
]
